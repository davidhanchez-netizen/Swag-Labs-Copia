<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Swag Labs</title>
  <link rel="stylesheet" href="style.css">
</head>
<body class="inventory-body">

  <header class="app-header">
    <button class="menu-btn" id="menuBtn">&#9776;</button>
    <h1 class="app-logo">Swag Labs</h1>
    <a href="cart.html" class="cart-icon">
      🛒<span class="cart-badge" id="cartBadge">0</span>
    </a>
  </header>

  <nav class="side-menu" id="sideMenu">
    <div class="side-menu-header">
      <button id="closeMenuBtn">&times;</button>
    </div>
    <a href="inventory.html">All Items</a>
    <a href="#">About</a>
    <a href="#" id="logoutBtn">Logout</a>
    <a href="#" id="resetBtn">Reset App State</a>
  </nav>

  <div class="subheader">
    <span class="items-count">6 items</span>
    <select id="sortSelect" class="sort-select">
      <option value="az">Name (A to Z)</option>
      <option value="za">Name (Z to A)</option>
      <option value="lohi">Price (low to high)</option>
      <option value="hilo">Price (high to low)</option>
    </select>
  </div>

  <main class="inventory-grid" id="inventoryGrid">
    <!-- Los productos se generan con JavaScript -->
  </main>

  <script src="script.js"></script>
  <script src="inventory.js"></script>
</body>
</html>
